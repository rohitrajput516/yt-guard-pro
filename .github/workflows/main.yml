name: Build Integrated YouTube Guard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile YTGuardEngine & Build Stable Integrated APK
        run: |
          set -e
          PLATFORM_JAR=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          curl -sL "https://github.com/REAndroid/APKEditor/releases/download/V1.3.9/APKEditor-1.3.9.jar" -o APKEditor.jar

          cat << 'EOF' > YTGuardInitProvider.java
          package com.rohit.ytguard;

          import android.app.Activity;
          import android.app.Application;
          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.util.Map;

          public class YTGuardInitProvider extends ContentProvider {
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              public boolean onCreate() {
                  final Context ctx = getContext();
                  if (ctx != null) {
                      YTGuardEngine.initFromContext(ctx);
                  }
                  startActivityProbe();
                  return true;
              }

              private void startActivityProbe() {
                  handler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Activity act = getCurrentActivity();
                              if (act != null && !act.isFinishing()) {
                                  YTGuardEngine.initFromContext(act);
                              }
                          } catch (Throwable ignored) {
                          }
                          handler.postDelayed(this, 1200L);
                      }
                  }, 400L);
              }

              private static Activity getCurrentActivity() {
                  try {
                      Class<?> atClass = Class.forName("android.app.ActivityThread");
                      Method currentAt = atClass.getMethod("currentActivityThread");
                      Object at = currentAt.invoke(null);
                      if (at == null) return null;

                      try {
                          Method getApp = atClass.getMethod("getApplication");
                          Object appObj = getApp.invoke(at);
                          if (appObj instanceof Application) {
                              YTGuardEngine.initFromContext((Application) appObj);
                          }
                      } catch (Throwable ignored) {
                      }

                      Field activitiesField = atClass.getDeclaredField("mActivities");
                      activitiesField.setAccessible(true);
                      Object activitiesObj = activitiesField.get(at);
                      if (activitiesObj instanceof Map) {
                          Map<?, ?> activities = (Map<?, ?>) activitiesObj;
                          for (Object record : activities.values()) {
                              if (record == null) continue;
                              Class<?> recordClass = record.getClass();
                              Field pausedField = recordClass.getDeclaredField("paused");
                              pausedField.setAccessible(true);
                              if (!pausedField.getBoolean(record)) {
                                  Field activityField = recordClass.getDeclaredField("activity");
                                  activityField.setAccessible(true);
                                  Object act = activityField.get(record);
                                  if (act instanceof Activity) {
                                      return (Activity) act;
                                  }
                              }
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return null;
              }

              @Override public Cursor query(Uri u, String[] p, String s, String[] sa, String so) { return null; }
              @Override public String getType(Uri u) { return null; }
              @Override public Uri insert(Uri u, ContentValues v) { return null; }
              @Override public int delete(Uri u, String s, String[] sa) { return 0; }
              @Override public int update(Uri u, ContentValues v, String s, String[] sa) { return 0; }
          }
          EOF

          mkdir -p build_dex/classes
          javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM_JAR" -classpath "$PLATFORM_JAR" -d build_dex/classes YTGuardEngine.java YTGuardInitProvider.java
          jar cf build_dex/classes.jar -C build_dex/classes .
          "$BUILD_TOOLS/d8" --min-api 21 --lib "$PLATFORM_JAR" --output build_dex/ build_dex/classes.jar

          RELEASE_URL=$(curl -sL "https://api.github.com/repos/${{ github.repository }}/releases" | grep -o 'https://github.com/[^"]*\.apk' | head -n 1 || true)
          if [ -z "$RELEASE_URL" ]; then
            echo "ERROR: No YouTube .apk found in Releases! Please attach your YouTube APK in GitHub Releases."
            exit 1
          fi
          curl -sL "$RELEASE_URL" -o raw_base.apk

          java -Xmx3g -jar APKEditor.jar d -t xml -i raw_base.apk -o apk_decoded

          python3 - << 'EOF'
          import os, re, glob, hashlib, zlib, struct

          manifest_path = "apk_decoded/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              xml_text = f.read()

          pkg_match = re.search(r'package="([^"]+)"', xml_text)
          orig_pkg = pkg_match.group(1) if pkg_match else "com.google.android.youtube"
          final_pkg = orig_pkg

          if orig_pkg == "com.google.android.youtube":
              # 26-char replacement that preserves DEX string table alphabetical order
              new_pkg = "com.google.android.youtubf"
              final_pkg = new_pkg

              for attr in ["android:name", "android:targetActivity", "android:backupAgent", "android:manageSpaceActivity"]:
                  xml_text = re.sub(rf'{attr}="\.([^"]+)"', f'{attr}="{orig_pkg}.\\1"', xml_text)

              xml_text = re.sub(r'package="com\.google\.android\.youtube"', f'package="{new_pkg}"', xml_text)
              xml_text = xml_text.replace(f'android:authorities="{orig_pkg}', f'android:authorities="{new_pkg}')
              xml_text = re.sub(r'(<permission\b[^>]*android:name=")com\.google\.android\.youtube([^"]*")', f'\\1{new_pkg}\\2', xml_text)
              xml_text = re.sub(r'(<uses-permission\b[^>]*android:name=")com\.google\.android\.youtube([^"]*")', f'\\1{new_pkg}\\2', xml_text)

              for res_file in glob.glob("apk_decoded/resources/**/strings.xml", recursive=True):
                  with open(res_file, "r", encoding="utf-8", errors="ignore") as rf:
                      st = rf.read()
                  if orig_pkg in st:
                      st = st.replace(orig_pkg, new_pkg)
                      with open(res_file, "w", encoding="utf-8") as wf:
                          wf.write(st)

              old_bytes = (orig_pkg + ".").encode("utf-8")
              new_bytes = (new_pkg + ".").encode("utf-8")
              for dex_file in glob.glob("apk_decoded/root/classes*.dex"):
                  with open(dex_file, "rb") as df:
                      data = bytearray(df.read())
                  if old_bytes in data:
                      data = data.replace(old_bytes, new_bytes)
                      sha1 = hashlib.sha1(data[32:]).digest()
                      data[12:32] = sha1
                      adler = zlib.adler32(data[12:]) & 0xffffffff
                      data[8:12] = struct.pack("<I", adler)
                      with open(dex_file, "wb") as df:
                          df.write(data)

          if 'android:extractNativeLibs="' in xml_text:
              xml_text = re.sub(r'android:extractNativeLibs="[^"]+"', 'android:extractNativeLibs="true"', xml_text)
          else:
              xml_text = xml_text.replace("<application ", '<application android:extractNativeLibs="true" ', 1)

          provider_tag = (
              f'\n        <provider android:name="com.rohit.ytguard.YTGuardInitProvider" '
              f'android:authorities="{final_pkg}.ytguard.initprovider" '
              f'android:exported="false" android:initOrder="999" />'
          )
          xml_text = re.sub(r'(<application\b[^>]*>)', r'\1' + provider_tag, xml_text, count=1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(xml_text)
          EOF

          DEX_COUNT=$(ls apk_decoded/root/classes*.dex | wc -l)
          NEXT_DEX="classes$((DEX_COUNT + 1)).dex"
          cp build_dex/classes.dex "apk_decoded/root/$NEXT_DEX"

          java -Xmx3g -jar APKEditor.jar b -i apk_decoded -o base.apk
          rm -rf apk_decoded raw_base.apk

          "$BUILD_TOOLS/zipalign" -p -f 4 base.apk YouTube-YTGuard-Integrated.apk
          rm -f release.keystore
          keytool -genkey -v -keystore release.keystore -alias ytguard -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Rohit, OU=Dev, O=YTGuard, L=Dholpur, S=RJ, C=IN"
          "$BUILD_TOOLS/apksigner" sign --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 YouTube-YTGuard-Integrated.apk

      - name: Upload Integrated YouTube APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-YTGuard-Single-App
          path: YouTube-YTGuard-Integrated.apk
