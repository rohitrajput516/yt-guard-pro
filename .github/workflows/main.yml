name: Build Integrated YouTube Guard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile YTGuardEngine & Inject Into YouTube APK
        run: |
          set -e
          PLATFORM_JAR=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          mkdir -p build_dex/classes
          javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM_JAR" -classpath "$PLATFORM_JAR" -d build_dex/classes YTGuardEngine.java
          jar cf build_dex/classes.jar -C build_dex/classes .
          "$BUILD_TOOLS/d8" --min-api 21 --lib "$PLATFORM_JAR" --output build_dex/ build_dex/classes.jar

          curl -sL https://repo1.maven.org/maven2/org/smali/baksmali/2.5.2/baksmali-2.5.2.jar -o baksmali.jar
          curl -sL https://repo1.maven.org/maven2/org/smali/smali/2.5.2/smali-2.5.2.jar -o smali.jar

          RELEASE_URL=$(curl -sL "https://api.github.com/repos/${{ github.repository }}/releases" | grep -o 'https://github.com/[^"]*\.apk' | head -n 1 || true)
          if [ -z "$RELEASE_URL" ]; then
            echo "ERROR: No YouTube .apk found in Releases! Please attach your YouTube APK in GitHub Releases (Step 3)."
            exit 1
          fi
          curl -sL "$RELEASE_URL" -o base.apk

          mkdir -p apk_work
          cp base.apk apk_work/working.apk
          unzip -q apk_work/working.apk "classes*.dex" -d apk_work/

          DEX_COUNT=$(ls apk_work/classes*.dex | wc -l)
          NEXT_DEX="classes$((DEX_COUNT + 1)).dex"

          HOOKED=0
          for DEX in $(ls apk_work/classes*.dex | sort -V); do
            SMALI_DIR="${DEX}_smali"
            java -jar baksmali.jar d "$DEX" -o "$SMALI_DIR"
            MATCHES=$(grep -rl "Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V" "$SMALI_DIR" || true)
            if [ -n "$MATCHES" ]; then
              for FILE in $MATCHES; do
                sed -i 's|invoke-super {p0, p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V|invoke-super {p0, p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V\n    invoke-static {p0}, Lcom/rohit/ytguard/YTGuardEngine;->initFromContext(Landroid/content/Context;)V|g' "$FILE"
                sed -i 's|invoke-super/range {p0 .. p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V|invoke-super/range {p0 .. p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V\n    invoke-static/range {p0 .. p0}, Lcom/rohit/ytguard/YTGuardEngine;->initFromContext(Landroid/content/Context;)V|g' "$FILE"
              done
              java -jar smali.jar a "$SMALI_DIR" -o "$DEX"
              HOOKED=1
            fi
            rm -rf "$SMALI_DIR"
            if [ "$HOOKED" -eq 1 ]; then
              break
            fi
          done

          cp build_dex/classes.dex "apk_work/$NEXT_DEX"
          (cd apk_work && zip -q -0 -u working.apk classes*.dex)

          "$BUILD_TOOLS/zipalign" -p -f 4 apk_work/working.apk YouTube-YTGuard-Integrated.apk
          keytool -genkey -v -keystore release.keystore -alias ytguard -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Rohit, OU=Dev, O=YTGuard, L=Dholpur, S=RJ, C=IN"
          "$BUILD_TOOLS/apksigner" sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 YouTube-YTGuard-Integrated.apk

      - name: Upload Integrated YouTube APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-YTGuard-Single-App
          path: YouTube-YTGuard-Integrated.apk
